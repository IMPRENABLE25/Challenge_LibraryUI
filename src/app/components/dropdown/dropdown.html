<div class="dropdown-shell relative inline-flex items-center gap-2">
  <button
    type="button"
    class="dropdown-trigger h-10 w-10 shrink-0 overflow-hidden rounded-full ring-2 ring-white transition-shadow duration-150 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-600"
    aria-label="Ouvrir le menu du compte"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleMenu()"
  >
    <img [src]="avatarUrl" alt="Profil Joachim IMPRENABLE" loading="lazy" class="h-full w-full object-cover" />
  </button>

  <!-- Dropdown menu -->
  @if (isOpen()) {
    <div
      class="dropdown-menu absolute right-0 top-full z-50 mt-3 w-64 overflow-hidden rounded-2xl p-2 ring-1"
      role="menu"
    >
      @for (item of menuItems(); track item.id) {
        @if (item.dividerBefore) {
          <div class="my-2 border-t border-gray-100"></div>
        }

        <button
          type="button"
          role="menuitem"
          class="dropdown-item flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm transition-colors duration-100"
          [class.font-semibold]="activeId() === item.id"
          [class.text-[#EDE6DA]]="activeId() === item.id"
          [class.text-[#D7CDBE]]="activeId() !== item.id"
          (click)="selectItem(item)"
        >
          <span class="flex h-5 w-5 shrink-0 items-center justify-center text-gray-500" aria-hidden="true">
            @switch (item.icon) {
              @case ('profile') {
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="3.5" />
                  <path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" />
                </svg>
              }
              @case ('wallet') {
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h12A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-12A2.5 2.5 0 0 1 3 16.5v-9Z" />
                  <path d="M16 12h5v3h-5" />
                  <circle cx="15.5" cy="12" r="1" />
                </svg>
              }
              @case ('network') {
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="5" r="2.5" />
                  <circle cx="5" cy="19" r="2.5" />
                  <circle cx="19" cy="19" r="2.5" />
                  <path d="M9.5 7.5 6.8 16.3M14.5 7.5l2.7 8.8" />
                </svg>
              }
              @case ('help') {
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="8.5" />
                  <path d="M12 11v5" />
                  <path d="M12 8v.01" />
                </svg>
              }
              @case ('sign-out') {
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <path d="M16 17l5-5-5-5" />
                  <path d="M21 12H9" />
                </svg>
              }
            }
          </span>

          <span class="flex-1 truncate">{{ item.label }}</span>

          @if (item.badge) {
            <span class="dropdown-badge inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-bold">
              <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M13 2 3 14h6l-1 8 11-14h-7l1-6Z" />
              </svg>
              {{ item.badge }}
            </span>
          }
        </button>
      }
    </div>
  }
</div>
